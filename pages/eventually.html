    <script>
      (function ($) {
        $(function () {
          // Handles menu click, smooth animated toggle, and re-click to close
          $('nav ul li a:not(:only-child)').on('click', function (e) {
            e.preventDefault();
            e.stopPropagation();

            const $parentLi = $(this).parent('li');
            const isOpen = $parentLi.hasClass('dropdown-open');

            // Close all other open dropdowns
            $('nav ul li').not($parentLi).removeClass('dropdown-open');

            // Toggle current dropdown: if open, close it; if closed, open it
            if (isOpen) {
              $parentLi.removeClass('dropdown-open');
            } else {
              $parentLi.addClass('dropdown-open');
            }
          });

          // Close dropdown when clicking outside
          $(document).on('click', function (e) {
            if (!$(e.target).closest('nav').length) {
              $('nav ul li').removeClass('dropdown-open');
            }
          });

          // Mobile hamburger menu toggle
          $('#nav-toggle').on('click', function (e) {
            e.stopPropagation();
            $(this).toggleClass('active');
            $('nav ul.nav-list').toggleClass('open');
          });
        });
      })(jQuery);
    </script>
    <script>
// Get the button:
let mybutton = document.getElementById("scroll-top-btn");

// When the user scrolls down 20px from the top of the document, show the button
window.onscroll = function() {scrollFunction()};

function scrollFunction() {
  if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
    mybutton.style.display = "block";
  } else {
    mybutton.style.display = "none";
  }
}

// When the user clicks on the button, scroll to the top of the document
function topFunction() {
  document.body.scrollTop = 0; // For Safari
  document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
}
    </script> 
    <script>
  var timeInSecs;
var ticker;

function startTimer(secs) {
timeInSecs = parseInt(secs);
ticker = setInterval("tick()", 1000); 
}

function tick( ) {
var secs = timeInSecs;
if (secs > 0) {
timeInSecs--; 
}
else {
clearInterval(ticker);
startTimer(5*60); // 4 minutes in seconds
}


var hours= Math.floor(secs/3600);
secs %= 3600;
var mins = Math.floor(secs/60);
secs %= 60;
var pretty = ( (hours < 10 ) ? "0" : "" ) + hours + ":" + ( (mins < 10) ? "0" : "" ) + mins + ":" + ( (secs < 10) ? "0" : "" ) + secs;

document.getElementById("countdown").innerHTML = pretty;
}

startTimer(60*60*24); // 4 minutes in seconds

//Credits to Philip M from codingforum
    </script>
