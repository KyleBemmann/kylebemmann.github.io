    <!-- Dependencies -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/css/stylesheet.css" />  
    <link rel="stylesheet" href="/css/navigation.css" />
    <link rel="stylesheet" href="/css/1.css" />
    <link rel="stylesheet" href="/css/animation.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/scripts/theme.js"></script>
    <script src="/scripts/html-injector.js" defer></script>
    <script src="/scripts/script.js" defer></script>
   </head>
   
  <body>
  
  <inject-html>
  </inject-html>

<!-- =============================================== -->
<!-- CONTENT LAYOUT -->
<!-- =============================================== -->
    
  <div class="layout">
    
<!-- HEADER -->

    <header>
      
      <div class="header-image">
        <picture>
          <!-- Desktop screens (768px wide and up) -->
            <source media="(min-width: 768px)" srcset="/images/eventually/header.jpg">
            <!-- Mobile screens (Default fallback for anything smaller than 768px) -->
              <img src="/images/eventually/header.png">
          </picture>
        </div> 
        
        <h1>If Not Today, Maybe Tomorrow</h1>
          
    </header>

<!-- LEFT SIDEBAR -->
      
    <aside>
      <div class="load-sidebar">
      
        <img class="pfp-image" src="/images/eventually/pfp.jpg">
          <h3>Eventually</h3>
            <div class="card-item">
              <p>The belief in the Second Coming of Christ is a cornerstone of Christian eschatology, described in the New Testament as a visible, physical, and glorious event at the end of the age.</p>
          </div>
      </div>      
    </aside>

<!-- MAIN CONTENT -->
     
<main> 
  <div class="load-timer"> 
   
     <div class="card-item-countdown"><span id="countdown"></span></div> 
     
 </div>       
</main>              
</div>

<!-- =============================================== -->
<!-- JAVASCRIPT LOGIC -->
<!-- =============================================== -->

    <script>
      let timeInSecs;
      let ticker;

      function startTimer(secs) {
        timeInSecs = parseInt(secs, 10);
        ticker = setInterval(tick, 1000);
      }

      function tick() {
        let secs = timeInSecs;
        if (secs > 0) {
          timeInSecs--;
        } else {
          clearInterval(ticker);
          startTimer(5 * 60);
        }

        const hours = Math.floor(secs / 3600);
        secs %= 3600;
        const mins = Math.floor(secs / 60);
        secs %= 60;
        const pretty =
          (hours < 10 ? "0" : "") + hours + ":" +
          (mins < 10 ? "0" : "") + mins + ":" +
          (secs < 10 ? "0" : "") + secs;

        const countdownEl = document.getElementById("countdown");
        if (countdownEl) {
          countdownEl.textContent = pretty;
        }
      }

      startTimer(60 * 60 * 24);
    </script>
  </body>
</html>
